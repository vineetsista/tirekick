name: CI

# LAW 7. Every gate runs on every push. No ANTHROPIC_API_KEY is configured for
# this workflow and none is needed: TIREKICK_MODE defaults to fixture, so the
# engines serve cached responses and make no API calls (D-009). If a change ever
# makes CI need a key, CI fails - which is the intended alarm, not a nuisance.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TIREKICK_MODE: fixture

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Python 3.12 is pinned to match local (D-001).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install python engines
        run: bash scripts/py-setup.sh

      # ffmpeg is used by the audio engine and by fixture media generation. Like
      # the chromium step below it is not optional: test_signal.py fails rather
      # than skips without it (D-050), and gates.sh refuses to start at all, so a
      # runner without ffmpeg goes red instead of reporting a green it did not earn.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # layout.test.ts lays the real components out in a real engine and measures
      # overflow, line length and contrast (D-050). Six of P8's eight defects were
      # invisible to every other test and visible here. `--with-deps` pulls the
      # shared libraries headless chromium needs on a bare ubuntu runner.
      #
      # This step is not optional and the test does not skip when the browser is
      # missing: a gate that quietly passes because it never ran is the exact
      # failure this project has now found six times.
      - name: Install chromium for the layout gate
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run all gates
        run: bash scripts/gates.sh

      # The report the web app renders is the artifact worth keeping when a run
      # goes red - it is the fastest way to see what the engines actually emitted.
      - name: Upload fixture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-report
          path: fixtures/reports/demo-01.report.json
          if-no-files-found: warn
          retention-days: 14

  no-key-required:
    name: no api key required
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Guards LAW 7 directly: the fixture inspection must complete with the
      # environment scrubbed of every credential.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python engines
        run: bash scripts/py-setup.sh

      - name: Fixture inspection with no credentials present
        env:
          ANTHROPIC_API_KEY: ""
          TIREKICK_MODE: ""
        run: |
          unset ANTHROPIC_API_KEY
          unset TIREKICK_MODE
          packages/engines/.venv/bin/python -m tirekick_engines.cli inspect \
            --fixture demo-01 --out /tmp/no-key.report.json
          test -s /tmp/no-key.report.json

  sdk-contract:
    name: sdk contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The one job that installs the Anthropic SDK, and the only place the real
    # package is ever opened. `client._retryable_errors` reads two attributes off
    # it and returns () when the import fails - and () is a legal `except` clause
    # that catches nothing, so an SDK rename does not raise, it silently turns
    # the retry loop into a single attempt.
    #
    # It cannot live in packages/engines/tests: that suite has to pass with no
    # SDK installed (D-009), and the one line that would close the gap there -
    # `pytest.importorskip("anthropic")` - is exactly the line that removed the
    # retry tests from CI for a phase while still reporting a pass.
    #
    # This job is allowed to break on an upstream release. That is the alarm
    # working: the gates job stays green, the product keeps running without a
    # key, and the thing that is actually broken - our retry wiring against the
    # current SDK - is the thing that goes red.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python engines with the live extra
        run: |
          bash scripts/py-setup.sh
          packages/engines/.venv/bin/pip install -e 'packages/engines[live]'

      - name: The SDK still defines what client.py reads
        run: packages/engines/.venv/bin/python scripts/check_sdk_contract.py
