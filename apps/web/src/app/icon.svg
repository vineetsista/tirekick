<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The reticle, which is the one mark this product has.

    Every finding in a TIREKICK report is a box drawn on a photograph with ticks
    at its corners - an instrument framing a region, not a highlighter. The icon
    is that box with nothing inside it, because what the product is actually
    selling is the framing rather than any particular defect.

    Drawn rather than imported: an .ico would have been a binary blob nobody in
    the repository could read or check against the interface it stands for.
  -->
  <rect width="32" height="32" fill="#0b0a09"/>
  <g fill="none" stroke="#f4efe6" stroke-width="2.5">
    <path d="M7 11.5V7h4.5"/>
    <path d="M20.5 7H25v4.5"/>
    <path d="M25 20.5V25h-4.5"/>
    <path d="M11.5 25H7v-4.5"/>
  </g>
  <circle cx="16" cy="16" r="2" fill="#ef8b3f"/>
</svg>
