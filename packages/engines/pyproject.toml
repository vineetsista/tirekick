[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tirekick-engines"
version = "0.0.0"
description = "TIREKICK vision / audio / data / pricing / dossier engines"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "pillow>=11.0,<12",
    "numpy>=2.1,<3",
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<0.9",
    "mypy>=1.14,<2",
]
live = [
    "anthropic>=0.42,<1",
]

[project.scripts]
tirekick = "tirekick_engines.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 96
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["tirekick_engines"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
