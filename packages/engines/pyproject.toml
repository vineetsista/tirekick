[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tirekick-engines"
version = "0.0.0"
description = "TIREKICK vision / audio / data / pricing / dossier engines"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "pillow>=11.0,<12",
    "numpy>=2.1,<3",
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<0.9",
    "mypy>=1.14,<2",
]
# The SDK stays optional, and that is a decision rather than an oversight. LAW 7
# promises a fork with no secrets gets a green build, so `scripts/py-setup.sh` -
# which is what ci.yml runs - installs `dev` alone and CI never has `anthropic`.
#
# The cost was real: the P9 audit found the retry and backoff tests had never
# executed in CI, because they needed `anthropic.APIStatusError` to construct the
# error they retry. Money-spending behaviour, guarded by tests that ran on one
# laptop. The fix was to make that behaviour testable without the SDK rather than
# to promote the dependency, because promoting it would mean installing the thing
# everywhere in order to prove it is needed nowhere.
#
# What holds this in place is not this comment. `test_live_vision.py` reads this
# file back: `anthropic` in `live` only, absent from `dev` and from the runtime
# dependencies, py-setup.sh installing `[dev]`, and ci.yml calling py-setup.sh.
live = [
    "anthropic>=0.42,<1",
]

[project.scripts]
tirekick = "tirekick_engines.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Prompts ship with the package. They are product code that happens to be prose,
# and an install that silently lacked them would fall back to nothing.
[tool.setuptools.package-data]
tirekick_engines = ["prompts/**/*.md"]

[tool.ruff]
line-length = 96
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["tirekick_engines"]
warn_unreachable = true

# The live extra is optional and CI installs only dev, so its stubs are absent
# there by design. Missing stubs must not be a type error, or the gate that proves
# fixture mode needs nothing would itself need the thing.
[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
